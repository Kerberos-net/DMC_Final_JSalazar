[project]
name = "smartnet-worker"
version = "0.1.0"
description = "SmartNet worker Python — ingesta y publicacion (BACKLOG #4: scraper SBS de tipo de cambio)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "pyodbc>=5.1",
    "google-api-python-client>=2.140",
    "google-auth>=2.34",
    # BACKLOG #6, WU1: parser XML/UBL endurecido (design.md, Decision 1). Adelantado desde el WU4
    # original de la lista de tareas porque ubl.py (WU1) lo necesita para importar.
    "lxml>=5.3",
    # BACKLOG #6, WU2: extraccion de texto/OCR local de PDF (design.md, Decision 3). Adelantado
    # desde el WU4 original de la lista de tareas por el mismo motivo que lxml en WU1 --
    # pdf_lectura.py necesita importarlos ahora. Tesseract en si es un binario de sistema, no un
    # paquete Python (README.md, "Prerequisitos de sistema").
    "pypdf>=5.1",
    "pypdfium2>=4.30",
    "pytesseract>=0.3.13",
    "Pillow>=11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.scripts]
smartnet-tipo-cambio = "smartnet_worker.cli_tipo_cambio:main"
smartnet-gmail = "smartnet_worker.cli_gmail:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integracion: pruebas que requieren una instancia SQL Server real y pyodbc funcional (design.md Decision 7)",
    "externa: pruebas que hacen scraping real contra sbs.gob.pe, excluidas de CI por defecto",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
