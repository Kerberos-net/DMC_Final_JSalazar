<dialog #dialogo class="confirmar-reproceso">
  <p>¿Reprocesar este documento?</p>
  <button type="button" data-testid="confirmar-reproceso-cancelar" (click)="onCancelar()">
    Cancelar
  </button>
  <button type="button" data-testid="confirmar-reproceso-confirmar" (click)="onConfirmar()">
    Confirmar
  </button>
</dialog>
