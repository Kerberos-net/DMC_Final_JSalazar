@if (errores().length > 0) {
  <ul data-testid="panel-errores" class="panel-errores">
    @for (error of errores(); track error.procesamientoErrorId) {
      <li data-testid="error-item">
        <span data-testid="error-clasificacion">{{ error.clasificacion }}</span>
        <span data-testid="error-mensaje">{{ error.mensaje }}</span>
        <span data-testid="error-ocurrido-en">{{ error.ocurridoEn | date: 'short' }}</span>
      </li>
    }
  </ul>
}
