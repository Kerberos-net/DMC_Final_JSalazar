<section class="login-page">
  <div class="panel login-page__tarjeta">
    <span class="login-page__logo" data-testid="logo-badge" aria-hidden="true">GF</span>

    <h1 class="login-page__titulo">Gestor de Facturas de Compra</h1>
    <p class="login-page__subtitulo" data-testid="subtitulo">
      Inicia sesion para revisar y validar facturas
    </p>

    <form class="login-page__form" (submit)="$event.preventDefault(); enviar()">
      <input
        class="campo login-page__input"
        data-testid="nombreUsuario"
        aria-label="Usuario"
        placeholder="Usuario"
        [value]="nombreUsuario()"
        (input)="nombreUsuario.set($any($event.target).value)"
        autocomplete="username"
      />

      <input
        class="campo login-page__input"
        data-testid="clave"
        type="password"
        aria-label="Contraseña"
        placeholder="Contraseña"
        [value]="clave()"
        (input)="clave.set($any($event.target).value)"
        autocomplete="current-password"
      />

      <div class="login-page__error" data-testid="error-slot">
        @if (problema(); as p) {
          <p class="login-page__error-texto" role="alert">{{ p.detail }}</p>
        }
      </div>

      <button
        class="btn login-page__enviar"
        data-testid="enviar"
        type="submit"
        [disabled]="enviando()"
      >
        Ingresar
      </button>
    </form>

    <p class="login-page__pie" data-testid="pie">Credenciales verificadas contra SQL Server</p>
  </div>
</section>
