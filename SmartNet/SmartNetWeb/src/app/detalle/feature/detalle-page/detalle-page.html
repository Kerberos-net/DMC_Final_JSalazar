<section class="detalle-page">
  @if (loading()) {
    <p data-testid="detalle-loading">Cargando…</p>
  }

  <app-conflicto-banner
    [problema]="problema()"
    [categoria]="categoriaProblema()"
    (recargar)="recargar()"
  />

  @if (factura(); as f) {
    <header class="detalle-page__cabecera">
      <button class="btn btn--secundario" type="button" data-testid="volver" (click)="volver()">← Volver</button>
      <h1 class="detalle-page__titulo" data-testid="detalle-titulo">{{ tituloDetalle() }}</h1>
      <span
        class="chip"
        data-testid="estado-pill"
        [class.chip--pendiente]="estadoPill() === 'pendiente'"
        [class.chip--validada]="estadoPill() === 'validada'"
        [class.chip--descartada]="estadoPill() === 'descartada'"
      >
        {{ f.estado }}
      </span>
      <div class="detalle-page__acciones" data-testid="detalle-acciones">
        <button class="btn btn--secundario" type="button" data-testid="guardar-avance" (click)="guardarAvance()">
          Guardar avance
        </button>
        <button
          class="btn"
          type="button"
          data-testid="validar"
          [disabled]="!puedeValidar()"
          (click)="validar(fechaCorteContable())"
        >
          Validar
        </button>
      </div>
    </header>

    <app-indicadores-factura
      [posibleDuplicado]="f.posibleDuplicado"
      [esProveedorGenerico]="f.esProveedorGenerico"
      [tipoCambioFaltante]="tipoCambioFaltante()"
    />

    <div class="detalle-layout">
      <app-visor-documento class="detalle-layout__visor" [documentos]="documentos()" />

      <div class="detalle-formulario">
        <app-factura-form
          [factura]="f"
          [tipoCambioVenta]="asiento()?.tipoCambioVenta ?? null"
          [editable]="f.estado !== 'VALIDADA'"
          (cambios)="onCambiosFactura($event)"
          (confirmarAfectacion)="onConfirmarAfectacion($event)"
        />

        @if (asiento(); as a) {
          <div class="detalle-asiento">
            <app-asiento-lineas
              [lineas]="a.lineas"
              [editable]="a.estado !== 'CONFIRMADO'"
              [historial]="historial()"
              [cuadre]="cuadre()"
              (editarLinea)="onEditarLinea($event)"
              (agregarLinea)="onAgregarLinea($event)"
              (eliminarLinea)="onEliminarLinea($event)"
            />

            <label class="campo detalle-asiento__corte">
              Fecha de corte contable
              <input
                data-testid="fecha-corte-contable"
                type="date"
                [value]="fechaCorteContable()"
                (input)="fechaCorteContable.set($any($event.target).value)"
              />
            </label>
          </div>
        }
      </div>
    </div>
  }
</section>
