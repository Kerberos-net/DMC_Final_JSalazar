<div class="inbox-filter">
  <label>
    Estado
    <select
      data-testid="estado-select"
      [value]="estado() ?? ''"
      (change)="onEstadoSelect($any($event.target).value)"
    >
      <option value="">Todos</option>
      <option value="PROMOVIDO">Promovido</option>
      <option value="DESCARTADO">Descartado</option>
      <option value="PENDIENTE">Pendiente</option>
    </select>
  </label>

  <label>
    Desde
    <input
      type="date"
      data-testid="desde-input"
      [value]="desde() ?? ''"
      (change)="onDesdeChange($any($event.target).value)"
    />
  </label>

  <label>
    Hasta
    <input
      type="date"
      data-testid="hasta-input"
      [value]="hasta() ?? ''"
      (change)="onHastaChange($any($event.target).value)"
    />
  </label>

  <label>
    Proveedor
    <input
      type="text"
      data-testid="proveedor-input"
      [value]="proveedor() ?? ''"
      (change)="onProveedorChange($any($event.target).value)"
      (keydown.enter)="onProveedorChange($any($event.target).value)"
    />
  </label>

  <label>
    Orden por fecha
    <select
      data-testid="orden-select"
      [value]="orden()"
      (change)="onOrdenSelect($any($event.target).value)"
    >
      <option value="desc">Más reciente primero</option>
      <option value="asc">Más antiguo primero</option>
    </select>
  </label>
</div>
