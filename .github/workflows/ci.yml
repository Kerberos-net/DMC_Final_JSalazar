# Two jobs on purpose.
#
# `verificaciones-estaticas` needs no database, so it answers in seconds and can never be skipped
# for infrastructure reasons. It carries the two guardians this project cannot lose: the `dbo`
# write lint (ADR 0003's strongest invariant -- nobody writes an external table) and the checksum
# manifest (DbUp records a script NAME and never re-reads its content, so an edited applied script
# drifts from the database in silence).
#
# `pruebas-de-base-de-datos` raises a real SQL Server and runs the whole suite, including the
# permission matrix under EXECUTE AS. That is the job that actually proves the schema and the
# GRANT/DENY matrix, and it is why the fast job is not enough on its own.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  SOLUTION: SmartNet/SmartNet.sln
  # verificaciones-estaticas: no-database projects. SmartNet.Auth.Core.Tests is pure by
  # construction (PurityScanTests proves zero DB/HTTP/clock) -- the whole project belongs here,
  # no filter needed. SmartNet.Db.Runner.Tests mixes pure and DB-dependent tests in one project,
  # so only its two file-only suites are filtered in.
  TESTS_RUNNER: SmartNet/db/runner/SmartNet.Db.Runner.Tests
  TESTS_AUTH_CORE: SmartNet/auth/SmartNet.Auth.Core.Tests
  # pruebas-de-base-de-datos: every project whose tests use TestDatabaseFixture (throwaway
  # `fact_test_<guid>` databases) or WebApplicationFactory against a real SQL Server.
  TESTS_AUTH_INFRA: SmartNet/auth/SmartNet.Auth.Infrastructure.Tests
  TESTS_API: SmartNet/api/SmartNet.Api.Tests
  TESTS_ADMIN: SmartNet/admin/SmartNet.Admin.Tests

jobs:
  verificaciones-estaticas:
    name: Lint dbo y manifiesto de checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar y compilar
        run: dotnet build ${{ env.SOLUTION }} --configuration Release

      # These two suites read files only -- no database, no service container.
      - name: Lint de escritura sobre dbo y verificacion del manifiesto
        run: >
          dotnet test ${{ env.TESTS_RUNNER }}
          --configuration Release --no-build --logger "console;verbosity=normal"
          --filter "FullyQualifiedName~DboWriteLintTests|FullyQualifiedName~ChecksumManifestTests"

      # Pure domain logic (auth escalation state machine, PHC codec, lockout policy). No DB, no
      # HTTP, no wall clock -- PurityScanTests enforces this at build time for the whole project.
      - name: Nucleo de dominio de autenticacion (sin infraestructura)
        run: >
          dotnet test ${{ env.TESTS_AUTH_CORE }}
          --configuration Release --no-build --logger "console;verbosity=normal"

  pruebas-de-base-de-datos:
    name: Suite completa contra SQL Server
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          # Throwaway CI credential for an ephemeral container that is destroyed with the job.
          # It is not a secret: it guards nothing, reaches no real data, and is never reused.
          # No real credential belongs in this file -- the repository is public.
          MSSQL_SA_PASSWORD: 'CiSoloEfimero_2026!'
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'CiSoloEfimero_2026!' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 30s

    env:
      # The harness reads this; it falls back to local Integrated Security when unset.
      SMARTNET_TEST_MASTER_CONNECTION: 'Server=localhost,1433;Database=master;User Id=sa;Password=CiSoloEfimero_2026!;TrustServerCertificate=True;Encrypt=False'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar y compilar
        run: dotnet build ${{ env.SOLUTION }} --configuration Release

      # Every test creates its own throwaway `fact_test_<guid>` database and drops it. Nothing
      # here touches a shared or persistent database -- the container itself is discarded.
      #
      # Four separate `dotnet test` invocations, not one `--filter` across the solution: each
      # project needs a different inclusion rule (SmartNet.Db.Runner.Tests runs whole-project here
      # too -- its DB-dependent suites, e.g. the permission matrix under EXECUTE AS, live outside
      # the two names already filtered into verificaciones-estaticas; the other three run
      # whole-project with no filter at all). A single shared `--filter` expression across projects
      # with different inclusion needs would be more fragile than four explicit, reviewable lines.
      - name: Runner (suites dependientes de base de datos)
        run: >
          dotnet test ${{ env.TESTS_RUNNER }}
          --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Auth.Infrastructure
        run: >
          dotnet test ${{ env.TESTS_AUTH_INFRA }}
          --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Api
        run: >
          dotnet test ${{ env.TESTS_API }}
          --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Admin
        run: >
          dotnet test ${{ env.TESTS_ADMIN }}
          --configuration Release --no-build --logger "console;verbosity=normal"
