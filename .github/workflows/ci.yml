# Four jobs on purpose.
#
# `verificaciones-estaticas` needs no database, so it answers in seconds and can never be skipped
# for infrastructure reasons. It carries the two guardians this project cannot lose: the `dbo`
# write lint (ADR 0003's strongest invariant -- nobody writes an external table) and the checksum
# manifest (DbUp records a script NAME and never re-reads its content, so an edited applied script
# drifts from the database in silence). Every pure-domain .NET project and the worker's Python
# unit tests also land here (no DB, no HTTP, no wall clock).
#
# `pruebas-de-base-de-datos` raises a real SQL Server and runs the whole .NET suite, including the
# permission matrix under EXECUTE AS. That is the job that actually proves the schema and the
# GRANT/DENY matrix, and it is why the fast job is not enough on its own.
#
# `pruebas-de-worker-python` raises its OWN SQL Server container and runs the worker's real
# `pytest -m "integracion or ocr"` suite, which needs a server-scoped `CREATE LOGIN usr_worker` --
# that would mutate the container shared by the job above, so it gets a disposable one of its own
# (design.md Decision 7). `-m externa` (live scraping against sbs.gob.pe) is never run in CI.
# `ocr` (BACKLOG #6) is unlike `externa`: Tesseract is a deterministic local binary pinned by apt,
# not a third-party service, so it DOES run here -- `apt-get install tesseract-ocr
# tesseract-ocr-spa` below.
#
# `pruebas-de-frontend` needs no database either (BACKLOG #7, WU5: `SmartNet/spa/` bootstrap).
# Typecheck (`tsc --noEmit`, no ESLint config exists yet) plus `ng test` (vitest, jsdom) against
# the Inbox screen -- no backend involved, so this job never depends on the SQL Server jobs above.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  SOLUTION: SmartNet/SmartNet.sln
  # verificaciones-estaticas: no-database projects. SmartNet.Auth.Core.Tests is pure by
  # construction (PurityScanTests proves zero DB/HTTP/clock) -- the whole project belongs here,
  # no filter needed. SmartNet.Db.Runner.Tests mixes pure and DB-dependent tests in one project,
  # so only its two file-only suites are filtered in.
  TESTS_RUNNER: SmartNet/db/runner/SmartNet.Db.Runner.Tests
  TESTS_AUTH_CORE: SmartNet/auth/SmartNet.Auth.Core.Tests
  TESTS_CATALOGOS_CORE: SmartNet/catalogos/SmartNet.Catalogos.Core.Tests
  TESTS_TIPOS_CAMBIO_CORE: SmartNet/tipos-de-cambio/SmartNet.TiposCambio.Core.Tests
  TESTS_INBOX_CORE: SmartNet/inbox/SmartNet.Inbox.Core.Tests
  TESTS_CONTABLE_CORE: SmartNet/contable/SmartNet.Contable.Core.Tests
  # BACKLOG #11 (tasks.md Phase 4, task 4.4): the facturacion Core project -- ServicioDeFacturas/
  # ServicioDeAsientos/ServicioDeIntegraciones, TokenDeConcurrencia, ResultadoComando/CasoConflicto
  # -- has been pure-domain (PurityScanTests-guarded, no DB/HTTP/clock) since PR 1; it was missing
  # from this manifest, never actually running here despite existing since PR 1.
  TESTS_FACTURACION_CORE: SmartNet/facturacion/SmartNet.Facturacion.Core.Tests
  # pruebas-de-base-de-datos: every project whose tests use TestDatabaseFixture (throwaway
  # `fact_test_<guid>` databases) or WebApplicationFactory against a real SQL Server.
  TESTS_AUTH_INFRA: SmartNet/auth/SmartNet.Auth.Infrastructure.Tests
  TESTS_API: SmartNet/api/SmartNet.Api.Tests
  TESTS_ADMIN: SmartNet/admin/SmartNet.Admin.Tests
  TESTS_CATALOGOS_INFRA: SmartNet/catalogos/SmartNet.Catalogos.Infrastructure.Tests
  TESTS_TIPOS_CAMBIO_INFRA: SmartNet/tipos-de-cambio/SmartNet.TiposCambio.Infrastructure.Tests
  TESTS_INBOX_INFRA: SmartNet/inbox/SmartNet.Inbox.Infrastructure.Tests
  # BACKLOG #11 (tasks.md Phase 4, task 4.4): SqlFacturacionStore/SqlUnidadDeTrabajo/
  # SqlCommandQueueRepository/SqlEstadoIntegracionRepository -- uses TestDatabaseFixture, same as
  # every other *.Infrastructure.Tests project below. Also missing from this manifest since PR 1.
  TESTS_FACTURACION_INFRA: SmartNet/facturacion/SmartNet.Facturacion.Infrastructure.Tests
  # pruebas-de-worker-python: the worker's own SQL Server container (own ephemeral usr_worker
  # server-scoped LOGIN, kept out of the .NET DB job's shared container).
  WORKER_DIR: SmartNet/worker
  # pruebas-de-frontend: BACKLOG #7 WU5's Angular workspace. No SQL Server needed.
  SPA_DIR: SmartNet/spa

jobs:
  verificaciones-estaticas:
    name: Lint dbo y manifiesto de checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar y compilar
        run: dotnet build ${{ env.SOLUTION }} --configuration Release

      # These two suites read files only -- no database, no service container.
      - name: Lint de escritura sobre dbo y verificacion del manifiesto
        run: >
          dotnet test ${{ env.TESTS_RUNNER }}
          --configuration Release --no-build --logger "console;verbosity=normal"
          --filter "FullyQualifiedName~DboWriteLintTests|FullyQualifiedName~ChecksumManifestTests"

      # Pure domain logic (auth escalation state machine, PHC codec, lockout policy). No DB, no
      # HTTP, no wall clock -- PurityScanTests enforces this at build time for the whole project.
      - name: Nucleo de dominio de autenticacion (sin infraestructura)
        run: >
          dotnet test ${{ env.TESTS_AUTH_CORE }}
          --configuration Release --no-build --logger "console;verbosity=normal"

      # Pure domain logic (prefix-based candidate account resolution). No DB, no HTTP, no wall
      # clock -- PurityScanTests enforces this at build time for the whole project, same as
      # SmartNet.Auth.Core.Tests above.
      - name: Nucleo de dominio de catalogos y satelites (sin infraestructura)
        run: >
          dotnet test ${{ env.TESTS_CATALOGOS_CORE }}
          --configuration Release --no-build --logger "console;verbosity=normal"

      # Pure domain logic (SBS>MANUAL selection rule). No DB, no HTTP, no wall clock --
      # PurityScanTests enforces this at build time (adds System.Net.Http to the forbidden list,
      # spec.md requirement) for the whole project, same as the two suites above.
      - name: Nucleo de dominio de tipos de cambio (sin infraestructura)
        run: >
          dotnet test ${{ env.TESTS_TIPOS_CAMBIO_CORE }}
          --configuration Release --no-build --logger "console;verbosity=normal"

      # Pure domain logic (BACKLOG #7: promotion decision + 5 indicator flags). No DB, no HTTP, no
      # wall clock -- PurityScanTests enforces this at build time, same as the three suites above.
      - name: Nucleo de dominio de inbox y promocion (sin infraestructura)
        run: >
          dotnet test ${{ env.TESTS_INBOX_CORE }}
          --configuration Release --no-build --logger "console;verbosity=normal"

      # Pure domain logic (composicion de asiento PRINCIPAL/DESTINO, invariantes de confirmacion
      # §7). No DB, no HTTP, no wall clock -- PurityScanTests enforces this at build time, same as
      # the suites above. BACKLOG #8.
      - name: Nucleo de dominio contable (sin infraestructura)
        run: >
          dotnet test ${{ env.TESTS_CONTABLE_CORE }}
          --configuration Release --no-build --logger "console;verbosity=normal"

      # Pure orchestration logic (ServicioDeFacturas/ServicioDeAsientos/ServicioDeIntegraciones
      # command sequencing over a fake IUnidadDeTrabajo; TokenDeConcurrencia codec;
      # ResultadoComando/CasoConflicto shape). No DB, no HTTP, no wall clock -- PurityScanTests
      # enforces this at build time, same as the suites above. BACKLOG #11.
      - name: Nucleo de orquestacion de facturas y asientos (sin infraestructura)
        run: >
          dotnet test ${{ env.TESTS_FACTURACION_CORE }}
          --configuration Release --no-build --logger "console;verbosity=normal"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Unit tests only (marker exclusion) -- no database, no HTTP, no Tesseract. `-m externa`
      # (real scraping against sbs.gob.pe) is never selected here: a red build from SBS downtime
      # carries no information about our change (design.md Decision 7 / Testing Strategy). `-m ocr`
      # (BACKLOG #6) belongs to pruebas-de-worker-python, the job that installs Tesseract.
      - name: Worker Python -- pruebas unitarias (sin base de datos)
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          pip install -e .[dev]
          pytest -m "not integracion and not externa and not ocr"

  pruebas-de-base-de-datos:
    name: Suite completa contra SQL Server
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          # Throwaway CI credential for an ephemeral container that is destroyed with the job.
          # It is not a secret: it guards nothing, reaches no real data, and is never reused.
          # No real credential belongs in this file -- the repository is public.
          MSSQL_SA_PASSWORD: 'CiSoloEfimero_2026!'
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'CiSoloEfimero_2026!' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 30s

    env:
      # The harness reads this; it falls back to local Integrated Security when unset.
      SMARTNET_TEST_MASTER_CONNECTION: 'Server=localhost,1433;Database=master;User Id=sa;Password=CiSoloEfimero_2026!;TrustServerCertificate=True;Encrypt=False'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar y compilar
        run: dotnet build ${{ env.SOLUTION }} --configuration Release

      # Every test creates its own throwaway `fact_test_<guid>` database and drops it. Nothing
      # here touches a shared or persistent database -- the container itself is discarded.
      #
      # Four separate `dotnet test` invocations, not one `--filter` across the solution: each
      # project needs a different inclusion rule (SmartNet.Db.Runner.Tests runs whole-project here
      # too -- its DB-dependent suites, e.g. the permission matrix under EXECUTE AS, live outside
      # the two names already filtered into verificaciones-estaticas; the other three run
      # whole-project with no filter at all). A single shared `--filter` expression across projects
      # with different inclusion needs would be more fragile than four explicit, reviewable lines.
      - name: Runner (suites dependientes de base de datos)
        run: >
          dotnet test ${{ env.TESTS_RUNNER }}
          --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Auth.Infrastructure
        run: >
          dotnet test ${{ env.TESTS_AUTH_INFRA }}
          --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Api
        run: >
          dotnet test ${{ env.TESTS_API }}
          --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Admin
        run: >
          dotnet test ${{ env.TESTS_ADMIN }}
          --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Catalogos.Infrastructure
        run: >
          dotnet test ${{ env.TESTS_CATALOGOS_INFRA }}
          --configuration Release --no-build --logger "console;verbosity=normal"

      - name: TiposCambio.Infrastructure
        run: >
          dotnet test ${{ env.TESTS_TIPOS_CAMBIO_INFRA }}
          --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Inbox.Infrastructure
        run: >
          dotnet test ${{ env.TESTS_INBOX_INFRA }}
          --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Facturacion.Infrastructure
        run: >
          dotnet test ${{ env.TESTS_FACTURACION_INFRA }}
          --configuration Release --no-build --logger "console;verbosity=normal"

  pruebas-de-worker-python:
    name: Worker Python -- integracion contra SQL Server real (usr_worker)
    runs-on: ubuntu-latest

    # Own container, not the one above: proving fact_worker grants from Python needs a real
    # server-scoped CREATE LOGIN usr_worker, which would mutate the container shared by the .NET
    # harness (008's SUSER_ID guard premise, design.md Decision 7).
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          # Throwaway CI credential for an ephemeral container destroyed with the job -- same note
          # as the container above, this guards nothing and is never reused.
          MSSQL_SA_PASSWORD: 'CiSoloEfimero_2026!'
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'CiSoloEfimero_2026!' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 30s

    env:
      SMARTNET_TEST_SQL_HOST: localhost
      SMARTNET_WORKER_TEST_LOGIN_PASSWORD: 'CiSoloEfimero_2026!'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Instalar sqlcmd (verificacion de huerfanos)
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl -fsSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev

      # BACKLOG #6, design.md Decision 3/7: Tesseract es un binario de sistema que pip no puede
      # instalar. 'spa' es el paquete de idioma que pdf_lectura.py fija (config.OCR_IDIOMA).
      - name: Instalar Tesseract OCR (marker ocr)
        run: sudo apt-get install -y tesseract-ocr tesseract-ocr-spa

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar el worker (modo editable, con dependencias de dev)
        working-directory: ${{ env.WORKER_DIR }}
        run: pip install -e .[dev]

      # tests/integration/conftest.py provisiona su propia base efimera `fact_test_worker_<id>`,
      # aplica el esquema versionado real via `dotnet run --project SmartNet.Db.Runner` (nunca una
      # reimplementacion en Python -- ADR 0016) y crea un LOGIN efimero real `usr_worker` contra
      # ESTE contenedor, ejerciendo los GRANT reales de 008_usuarios_y_permisos.sql. `ocr`
      # (BACKLOG #6) corre contra el Tesseract real recien instalado -- ver tests/integration/
      # test_ocr_real.py. `-m externa` nunca se selecciona aqui (scraping real contra sbs.gob.pe
      # queda fuera de CI).
      - name: Worker Python -- pruebas de integracion y OCR (markers integracion, ocr)
        working-directory: ${{ env.WORKER_DIR }}
        run: pytest -m "integracion or ocr"

      - name: Confirmar cero bases y logins efimeros huerfanos
        if: always()
        run: |
          ORPHAN_DBS=$(/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'CiSoloEfimero_2026!' -h -1 -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE name LIKE 'fact_test_%';" | tr -d '[:space:]')
          ORPHAN_LOGINS=$(/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'CiSoloEfimero_2026!' -h -1 -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.server_principals WHERE name = 'usr_worker';" | tr -d '[:space:]')
          echo "Bases fact_test_* huerfanas: $ORPHAN_DBS"
          echo "Logins usr_worker huerfanos: $ORPHAN_LOGINS"
          if [ "$ORPHAN_DBS" != "0" ] || [ "$ORPHAN_LOGINS" != "0" ]; then
            echo "::error::Quedaron recursos efimeros sin limpiar."
            exit 1
          fi

  pruebas-de-frontend:
    name: SPA Angular -- typecheck y pruebas de la pantalla de Inbox
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: ${{ env.SPA_DIR }}/package-lock.json

      - name: Instalar dependencias
        working-directory: ${{ env.SPA_DIR }}
        run: npm ci

      # No ESLint config exists yet -- tsc --noEmit is the static check available today
      # (package.json's "lint" script). Add ESLint here once the project adopts it.
      - name: Typecheck
        working-directory: ${{ env.SPA_DIR }}
        run: npm run lint

      # BACKLOG #7 WU5's Inbox screen suite (InboxService, InboxFilter, InboxList, InboxPage) --
      # ng test runs @angular/build:unit-test (vitest + jsdom), no browser needed.
      - name: Pruebas (ng test)
        working-directory: ${{ env.SPA_DIR }}
        run: npm test -- --watch=false
